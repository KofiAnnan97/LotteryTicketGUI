[package]
name = "lotteryticketgui"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk = { version = "0.9.6", package = "gtk4", features = ["v4_14"] }
rand = "0.9.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sqlx = {version = "0.8.5", features = ["postgres", "macros"] }
serde = { version = "1.0.104", features = ["derive"] }
serde_json = "1.0.48"
chrono = "0.4.41"

[build-dependencies]
glib-build-tools = "0.20.0"
